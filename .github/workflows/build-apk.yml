name: Build Debug APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "releases/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          javac -version

      - name: Set up Android SDK (API 35)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create temporary debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare FrameCut-debug.apk
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/FrameCut-debug.apk
          ls -lh releases/FrameCut-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameCut-debug-apk
          path: releases/FrameCut-debug.apk
          retention-days: 30

      - name: Publish debug APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: FrameCut Debug APK (Latest)
          body: |
            Automated debug APK built from commit `${{ github.sha }}`.
            Download `FrameCut-debug.apk` below to install on Android.
          prerelease: true
          make_latest: true
          files: releases/FrameCut-debug.apk

      - name: Commit debug APK into repo (releases/FrameCut-debug.apk)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/FrameCut-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update FrameCut-debug.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "APK unchanged, skipping commit."
          fi
