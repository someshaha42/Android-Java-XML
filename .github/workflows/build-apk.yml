name: Build Debug APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage Debug APK artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/FrameCut-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameCut-debug-apk
          path: dist-apk/FrameCut-debug.apk
          retention-days: 30
